name: Build Price Updater EXE

on:
  push:
    paths:
      - 'update_price.py'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pillow pyinstaller

      - name: Build Standalone EXE
        run: |
          pyinstaller --onefile --noconsole --name "Обновить_прайс" update_price.py

      - name: Commit and Push EXE to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          move dist\Обновить_прайс.exe .\Обновить_прайс.exe
          git add Обновить_прайс.exe
          git commit -m "Auto-build Обновить_прайс.exe [skip ci]" || echo "No changes to commit"
          git push
